# 1. Alleen strikt noodzakelijke modules laden (minimale attack surface)
server.modules = (
    "mod_access",
    "mod_setenv"
)

# 2. Basisinstellingen & container-veilige paden (non-root en read-only geschikt)
server.port          = 8080
server.document-root = "/var/www/html"
server.pid-file      = "/tmp/lighttpd.pid"
server.upload-dirs   = ( "/tmp" )
index-file.names     = ( "index.html" )

# 3. MIME-types laden (verplicht zodat index.html als text/html wordt herkend en niet als download bij nosniff)
include "/etc/lighttpd/mime-types.conf"

# 4. Informatielekken en toegang tot gevoelige bestanden blokkeren
server.tag              = "webserver"
dir-listing.activate    = "disable"
server.max-request-size = 1024
url.access-deny         = ( "~", ".inc", ".env", ".git", ".htaccess", ".bak", ".sql" )

# 5. OWASP HTTP Security Headers
setenv.add-response-header = (
    "X-Content-Type-Options"  => "nosniff",
    "X-Frame-Options"         => "DENY",
    "Referrer-Policy"         => "strict-origin-when-cross-origin",
    "Permissions-Policy"      => "geolocation=(), microphone=(), camera=()",
    "Content-Security-Policy" => "default-src 'self'; script-src 'self' 'sha256-HmfZwr44RdS5Q4zqPDg9912yJDJQZaJsyPYQlyN+dTU='; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
)